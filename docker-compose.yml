services:
  ocr-worker:
    image: ghcr.io/gamagek/vidbest-multi-ocr:latest
    pull_policy: always
    restart: unless-stopped
    mem_limit: 420m
    cpus: 0.75
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.5-flash,gemini-3.8-flash}
      ENABLE_GEMINI: ${ENABLE_GEMINI:-false}
      OCR_LANG: eng+sin
      FRAME_INTERVAL: "5"
      MAX_FRAMES: "12"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ocr_input:/data/input:ro
      - ocr_output:/data/output
    command: ["python", "/app/worker.py", "--watch"]
volumes:
  ocr_input:
  ocr_output:
